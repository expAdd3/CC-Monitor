[tools]
bun = "1.3.14"
"cargo:tauri-cli" = "2.11.4"
rust = "1.97.1"


[settings]
experimental = true


[tasks.dev]
description = "Run Tauri development"
run = "./scripts/prepare-hook-sidecar.sh debug && cargo tauri dev"


[tasks.build]
description = "Build desktop application"
run = "bun run bundle:mac"

[tasks.clean]
description = "Remove reproducible Rust build and test artifacts"
run = "cargo clean"

[tasks.verify]
description = "Run the complete source verification gate"
run = "bun run verify"


[tasks.verify-release]
description = "Verify source and build the signed local application bundle"
run = ["sh ./scripts/check-release-worktree.sh", "./scripts/verify.sh", "./scripts/build-tauri-app.sh"]


[tasks.bootstrap]
description = "Install the locked frontend dependencies"
run = "bun install --frozen-lockfile"


[tasks.test]
description = "Run all Rust workspace tests"
run = "cargo test --workspace --all-features --all-targets"


[tasks.test-ui]
description = "Run the React frontend tests"
run = "bun run test"


[tasks.lint]
description = "Run Rust lint for all targets"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.format]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.ui]
description = "Build the React frontend"
run = "bun run build"
